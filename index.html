<style>
:root{
  --petrol:#0E3B36; --emer:#10B981; --sage:#0F7A5A; --sage-dark:#0B815E;
  --slate:#4E6B78; --taupe:#B45309; --rose:#DC2626; --tan:#F59E0B;
  --warm:#DCE5E2; --warm-light:#F1F6F4; --stone:#5F726C;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;background:var(--warm-light);color:#333;font-family:Calibri,Arial,sans-serif;font-size:15px;line-height:1.4;padding-bottom:96px;}
.header{background:var(--petrol);border-bottom:3px solid var(--emer);min-height:64px;display:flex;align-items:center;padding:10px 16px;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:30;}
.header img{height:34px;display:block;}
.divider{width:1px;height:30px;background:rgba(255,255,255,.35);}
.htitle{color:#fff;font-size:15px;font-weight:700;letter-spacing:.3px;}
.hsub{color:#F1F6F4;font-size:11.5px;}
.wrap{max-width:760px;margin:0 auto;padding:16px 14px;}
.card{background:#fff;border:1px solid var(--warm);border-radius:10px;padding:16px;margin-bottom:14px;}
.card h2{font-size:14px;font-weight:700;color:var(--sage-dark);margin:0 0 12px;text-transform:uppercase;letter-spacing:.4px;}
label{display:block;font-size:12px;font-weight:700;color:var(--stone);text-transform:uppercase;letter-spacing:.4px;margin-bottom:5px;}
input,select,textarea{width:100%;font-family:inherit;font-size:16px;color:#333;background:#fff;border:1.5px solid var(--warm);border-radius:8px;padding:11px 12px;outline:none;}
input:focus,select:focus,textarea:focus{border-color:var(--sage);}
.f{margin-bottom:14px;}
.fechainfo{background:var(--warm-light);border-left:4px solid var(--sage);border-radius:0 6px 6px 0;padding:9px 12px;margin-top:8px;font-size:13px;color:#333;}
.fechainfo b{color:var(--sage-dark);text-transform:uppercase;}
.fechainfo .sub{font-size:11.5px;color:var(--stone);margin-top:2px;}
.btn{display:block;width:100%;background:var(--sage);color:#fff;font-family:inherit;font-weight:700;font-size:15px;border:none;border-radius:8px;padding:14px;cursor:pointer;}
.btn:active{background:var(--sage-dark);}
.btn.sec{background:#fff;border:1.5px solid var(--warm);color:var(--sage);font-size:13px;padding:10px;}
.btn[disabled]{opacity:.45;}
.sec{background:#fff;border:1px solid var(--warm);border-radius:10px;margin-bottom:12px;overflow:hidden;}
.sech{background:var(--sage);color:#fff;padding:11px 14px;display:flex;align-items:center;gap:10px;cursor:pointer;}
.sech .st{font-size:13.5px;font-weight:700;flex:1;line-height:1.25;}
.sech .sc{font-size:11.5px;background:rgba(255,255,255,.2);border-radius:20px;padding:3px 9px;white-space:nowrap;}
.sech .ar{font-size:12px;opacity:.9;}
.secb{padding:4px 0;}
.sec.cl .secb{display:none;}
.allok{padding:8px 14px 10px;border-bottom:1px solid var(--warm-light);}
.allok button{background:#fff;border:1.5px solid var(--warm);color:var(--stone);font-family:inherit;font-size:11.5px;font-weight:700;border-radius:6px;padding:7px 12px;cursor:pointer;}
.it{padding:12px 14px;border-bottom:1px solid var(--warm-light);}
.it:last-child{border-bottom:none;}
.it .txt{font-size:13.5px;color:#333;line-height:1.35;margin-bottom:9px;}
.it .txt b{color:var(--sage-dark);margin-right:5px;}
.opts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;}
.opt{font-family:inherit;font-size:14px;font-weight:700;border:1.5px solid var(--warm);background:#fff;color:var(--stone);border-radius:8px;padding:11px 4px;cursor:pointer;}
.opt.ok.on{background:var(--sage);border-color:var(--sage);color:#fff;}
.opt.x.on{background:var(--rose);border-color:var(--rose);color:#fff;}
.opt.na.on{background:var(--slate);border-color:var(--slate);color:#fff;}
.obs{margin-top:9px;display:none;}
.obs.show{display:block;}
.obs textarea{font-size:14px;min-height:62px;border-color:var(--rose);}
.obs .lbl{font-size:11px;color:var(--rose);font-weight:700;text-transform:uppercase;margin-bottom:4px;letter-spacing:.4px;}
.foot{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--warm);padding:10px 14px;z-index:40;box-shadow:0 -2px 10px rgba(0,0,0,.07);}
.foot .in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px;}
.prog{flex:1;}
.prog .pt{font-size:11.5px;color:var(--stone);font-weight:700;display:flex;justify-content:space-between;margin-bottom:4px;}
.prog .pt b{color:var(--sage);font-size:14px;}
.pbar{height:7px;background:var(--warm-light);border-radius:4px;overflow:hidden;}
.pbar i{display:block;height:100%;background:var(--sage);width:0;transition:width .2s;}
.foot .btn{width:auto;padding:13px 22px;flex:none;}
.msg{border-radius:8px;padding:12px 14px;font-size:13px;margin-bottom:14px;display:none;}
.msg.err{background:#FBE9E9;border:1px solid var(--rose);color:#B91C1C;}
.msg.ok{background:#E8F5F0;border:1px solid var(--sage);color:var(--sage-dark);}
.msg.warn{background:#FEF6E7;border:1px solid var(--tan);color:#92400E;}
.msg.show{display:block;}
.hide{display:none!important;}
.done{text-align:center;padding:34px 20px;}
.done .big{font-size:52px;color:var(--sage);line-height:1;}
.done h2{font-size:19px;color:var(--sage-dark);margin:12px 0 6px;}
.done p{font-size:13.5px;color:var(--stone);margin:0 0 6px;}
.done .res{background:var(--warm-light);border-radius:10px;padding:14px;margin:16px 0;font-size:13px;color:#333;text-align:left;}
.done .res div{margin-bottom:4px;}
.pend{font-size:11.5px;color:var(--tan);font-weight:700;text-align:center;margin-top:8px;}
</style>
</head>

<div class="wrap">

        <label for="fecha">Fecha de la auditoría</label>

      <div class="res" id="resumen"></div>
      <button class="btn" id="btnNueva">Nueva auditoría</button>
    </div>
  </div>

</div>

/* ---------- almacenamiento local seguro ---------- */
function lsGet(k, def){ try{ const v = localStorage.getItem(k); return v === null ? def : v; }catch(e){ return def; } }
function lsSet(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }
function lsJson(k, def){ try{ const v = JSON.parse(localStorage.getItem(k) || 'null'); return v === null ? def : v; }catch(e){ return def; } }

/* Migración única desde la versión anterior (misma dirección github.io). Solo se
   traen los datos que tienen forma de check list; lo demás no se toca. */
(function migrarLocal(){
  const esCheck = p => p && p.id && p.fecha && p.sede && Array.isArray(p.respuestas) &&
                       p.respuestas.length && p.respuestas[0].seccion !== undefined && p.respuestas[0].res !== undefined;
  const viejo = lsJson('lives_cola', null);
  if(Array.isArray(viejo) && viejo.length){
    const mios = viejo.filter(esCheck), otros = viejo.filter(p => !esCheck(p));
    if(mios.length){
      const cola = lsJson(K_COLA, []);
      mios.forEach(p => { if(!cola.find(x => x.id === p.id)) cola.push(p); });
      lsSet(K_COLA, JSON.stringify(cola));
      if(otros.length) lsSet('lives_cola', JSON.stringify(otros)); else lsDel('lives_cola');
    }
  }
  const b = lsJson('lives_borrador', null);
  if(b && b.resp && b.sede && b.fecha && !lsGet(K_BORR, null)){ lsSet(K_BORR, JSON.stringify(b)); lsDel('lives_borrador'); }
  if(!lsGet(K_SEDE, null) && lsGet('lives_sede', null)) lsSet(K_SEDE, lsGet('lives_sede', ''));
})();

/* ---------- conexión ---------- */
async function rpcUna(fn, cuerpo){
  const ctl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
  const reloj = setTimeout(() => { if(ctl) ctl.abort(); }, 20000);
  let r;
  try{
    r = await fetch(SB_URL + '/rest/v1/rpc/' + fn, {
      method:'POST', cache:'no-store',
      headers:{'Content-Type':'application/json', 'apikey':SB_KEY},
      body: JSON.stringify(cuerpo || {}), signal: ctl ? ctl.signal : undefined});
  }catch(e){
    clearTimeout(reloj);
    const err = new Error(e && e.name === 'AbortError' ? 'la respuesta tardó demasiado' : 'sin conexión');
    err.red = true; throw err;
  }
  clearTimeout(reloj);
  const txt = await r.text();
  let j = null; try{ j = txt ? JSON.parse(txt) : null; }catch(e){}
  if(!r.ok){
    const err = new Error((j && (j.message || j.hint)) || ('error del servidor ' + r.status));
    err.red = (r.status >= 500 || r.status === 429); throw err;
  }
  return j;
}
/* Un reintento ante corte de señal; la siguiente acción vuelve a intentar sola. */
async function rpc(fn, cuerpo){
  try{ return await rpcUna(fn, cuerpo); }
  catch(e){
    if(!e.red) throw e;
    await new Promise(r => setTimeout(r, 1200));
    return await rpcUna(fn, cuerpo);
  }
}

/* ---------- Fecha: día de la semana + semana ISO ---------- */
function semanaISO(f){
  const p = f.split('-');
  const d = new Date(Date.UTC(+p[0], +p[1]-1, +p[2]));
  const dia = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - dia);
  const ini = new Date(Date.UTC(d.getUTCFullYear(),0,1));
  return { semana: Math.ceil((((d - ini)/86400000)+1)/7), anioISO: d.getUTCFullYear() };
}
function partes(f){
  const p = f.split('-');
  const local = new Date(+p[0], +p[1]-1, +p[2]);
  const iso = semanaISO(f);
  return {
    fecha:f, anio:+p[0], mes:+p[1], dia:+p[2],
    diaSemana: DIAS[local.getDay()],
    mesNombre: MESES[+p[1]-1],
    semana: iso.semana, anioISO: iso.anioISO,
    semanaEtq: iso.anioISO + '-S' + String(iso.semana).padStart(2,'0')
  };
}
function hoyISO(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function pintarFecha(){
  const f = $('fecha').value;
  if(!f){ $('fechaInfo').innerHTML = '—'; return; }
  const p = partes(f);
  const finde = (p.diaSemana === 'SÁBADO' || p.diaSemana === 'DOMINGO');
  $('fechaInfo').innerHTML =
    '<b>' + p.diaSemana + '</b> ' + p.dia + ' de ' + p.mesNombre.toLowerCase() + ' de ' + p.anio +
    '<div class="sub">Semana ' + p.semana + ' del ' + p.anioISO + ' (' + p.semanaEtq + ') · Mes ' + p.mesNombre +
    (finde ? ' · <b style="color:#B45309">Fin de semana</b>' : '') + '</div>';
}
function fechaTxt(f){ const p = String(f||'').split('-'); return p.length === 3 ? p[2]+'/'+p[1]+'/'+p[0] : f; }

function msg(txt, tipo){
  const m = $('msg');
  m.className = 'msg show ' + (tipo || 'err');
  m.innerHTML = txt;
  window.scrollTo({top:0, behavior:'smooth'});
}
function limpiarMsg(){ $('msg').className = 'msg'; }

/* ---------- Catálogo y auditores ---------- */
async function cargarCatalogo(){
  const local = lsJson(K_CAT, null);
  if(local && Array.isArray(local.items) && local.items.length){
    CATALOGO = local.items;
    if(Array.isArray(local.auditores) && local.auditores.length) AUDITORES = local.auditores;
  }
  try{
    const j = await rpc('ol_inicio', {});
    if(j && j.ok && j.items && j.items.length){
      CATALOGO = j.items;
      if(j.auditores && j.auditores.length) AUDITORES = j.auditores;
      lsSet(K_CAT, JSON.stringify({items:CATALOGO, auditores:AUDITORES}));
    }
  }catch(e){
    msg('No hay conexión con la base de datos. Se usará la lista guardada en el equipo — igual puedes auditar; el envío quedará guardado en el celular hasta que vuelva la señal.', 'warn');
  }
  llenarSedes();
  llenarAuditores();
}
function llenarSedes(){
  const sedes = [...new Set(CATALOGO.map(i => i.sede))].sort();
  const s = $('sede'), prev = lsGet(K_SEDE, '');
  s.innerHTML = '<option value="">Selecciona la sede…</option>' +
    sedes.map(x => '<option value="'+esc(x)+'">'+esc(x)+'</option>').join('');
  if(prev && sedes.includes(prev)) s.value = prev;
}
function llenarAuditores(){
  const s = $('auditor'), prev = lsGet(K_AUD, '');
  s.innerHTML = '<option value="">Selecciona tu nombre…</option>' +
    AUDITORES.map(x => '<option value="'+esc(x)+'">'+esc(x)+'</option>').join('');
  if(prev && AUDITORES.includes(prev)) s.value = prev;
}

/* ---------- Render de ítems ---------- */
function clave(it){ return it.seccion + '||' + it.n; }

async function iniciar(){
  const f = $('fecha').value, sede = $('sede').value, aud = $('auditor').value;
  if(!f)   return msg('Falta la fecha de la auditoría.');
  if(f > hoyISO()) return msg('La fecha de la auditoría es posterior a hoy. Revisa la fecha.');
  if(!sede) return msg('Falta elegir la sede.');
  if(!aud)  return msg('Falta elegir el auditor.');
  limpiarMsg();
  lsSet(K_SEDE, sede);
  lsSet(K_AUD, aud);

  ITEMS = CATALOGO.filter(i => i.sede === sede)
                  .sort((a,b) => a.orden - b.orden || a.n - b.n);
  if(!ITEMS.length) return msg('La sede ' + esc(sede) + ' no tiene ítems activos en el catálogo.');

  const borr = leerBorrador();
  RESP = (borr && borr.sede === sede && borr.fecha === f) ? borr.resp : {};
  REEMPLAZAR = !!(borr && borr.sede === sede && borr.fecha === f && borr.reemplazar);

  /* ¿Ya se envió ese día? Se ofrece corregirlo en vez de duplicarlo.
     Sin señal se sigue igual: al enviar, la base vuelve a comprobarlo. */
  if(!REEMPLAZAR){
    $('btnIniciar').disabled = true; $('btnIniciar').textContent = 'Revisando…';
    try{
      const d = await rpc('ol_dia', {p_fecha: f, p_sede: sede});
      if(d && d.existe){
        const ok = confirm('Ya hay un check list del ' + fechaTxt(f) + ' en ' + sede +
          ', enviado por ' + d.auditor + ' (' + d.envio + ').\n\n' +
          'Aceptar: abrirlo para corregirlo (reemplaza al anterior).\nCancelar: no hacer nada.');
        if(!ok){ $('btnIniciar').disabled = false; $('btnIniciar').textContent = 'Iniciar check list'; return; }
        REEMPLAZAR = true;
        if(!Object.keys(RESP).length){
          RESP = {};
          (d.marcas || []).forEach(m => { RESP[m.seccion + '||' + m.n] = {res:m.res, obs:m.obs || ''}; });
        }
      }
    }catch(e){ /* sin señal: se sigue */ }
    $('btnIniciar').disabled = false; $('btnIniciar').textContent = 'Iniciar check list';
  }

  const p = partes(f);
  $('rSede').textContent = sede;
  $('rFecha').textContent = p.diaSemana + ' ' + p.dia + '/' + String(p.mes).padStart(2,'0') + '/' + p.anio + ' · Semana ' + p.semana;
  $('rAuditor').textContent = aud + (REEMPLAZAR ? ' · corrigiendo el check list ya enviado' : '');

  renderSecciones();
  guardarBorrador();
  $('paso1').classList.add('hide');
  $('paso2').classList.remove('hide');
  $('foot').classList.remove('hide');
  actualizarProgreso();
  window.scrollTo(0,0);
}

function renderSecciones(){
  const cont = $('secciones');
  const secs = [];
  ITEMS.forEach(i => { if(!secs.find(s => s.n === i.seccion)) secs.push({n:i.seccion, orden:i.orden}); });

  cont.innerHTML = secs.map((s, si) => {
    const its = ITEMS.filter(i => i.seccion === s.n);
    return '<div class="sec" id="sec'+si+'">' +
      '<div class="sech" onclick="toggleSec('+si+')">' +
        '<div class="st">'+esc(s.n)+'</div>' +
        '<div class="sc" id="sc'+si+'">0/'+its.length+'</div>' +
        '<div class="ar" id="ar'+si+'">▾</div>' +
      '</div>' +
      '<div class="secb">' +
        '<div class="allok"><button type="button" onclick="marcarTodo('+si+')">Marcar toda la sección OK</button></div>' +
        its.map(it => {
          const k = clave(it), r = RESP[k] || {};
          return '<div class="it" data-sec="'+si+'">' +
            '<div class="txt"><b>'+it.n+'.</b>'+esc(it.item)+'</div>' +
            '<div class="opts">' +
              '<button type="button" class="opt ok'+(r.res==='OK'?' on':'')+'" data-k="'+esc(k)+'" data-v="OK" onclick="marcar(this)">OK</button>' +
              '<button type="button" class="opt x'+(r.res==='X'?' on':'')+'" data-k="'+esc(k)+'" data-v="X" onclick="marcar(this)">X</button>' +
              '<button type="button" class="opt na'+(r.res==='NA'?' on':'')+'" data-k="'+esc(k)+'" data-v="NA" onclick="marcar(this)">N/A</button>' +
            '</div>' +
            '<div class="obs'+(r.res==='X'?' show':'')+'">' +
              '<div class="lbl">¿Qué se encontró? (observación)</div>' +
              '<textarea data-obs="'+esc(k)+'" oninput="guardarObs(this)" placeholder="Describe el hallazgo y dónde">'+esc(r.obs||'')+'</textarea>' +
            '</div>' +
          '</div>';
        }).join('') +
      '</div></div>';
  }).join('');
  secs.forEach((s,si) => contarSec(si));
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function toggleSec(si){
  const el = $('sec'+si);
  el.classList.toggle('cl');
  $('ar'+si).textContent = el.classList.contains('cl') ? '▸' : '▾';
}
function marcar(btn){
  const k = btn.dataset.k, v = btn.dataset.v;
  const cont = btn.closest('.it');
  const obs = cont.querySelector('.obs');
  /* Tocar de nuevo la opción ya marcada la quita: el ítem vuelve a estar
     sin evaluar y el botón Enviar se bloquea otra vez. */
  const yaEstaba = btn.classList.contains('on');
  cont.querySelectorAll('.opt').forEach(b => b.classList.remove('on'));

  if(yaEstaba){
    delete RESP[k];
    obs.classList.remove('show');
    cont.querySelector('textarea').value = '';
  }else{
    btn.classList.add('on');
    RESP[k] = RESP[k] || {};
    RESP[k].res = v;
    if(v === 'X'){ obs.classList.add('show'); }
    else { obs.classList.remove('show'); RESP[k].obs = ''; cont.querySelector('textarea').value = ''; }
  }
  contarSec(+cont.dataset.sec);
  actualizarProgreso();
  guardarBorrador();
}
function guardarObs(ta){
  const k = ta.dataset.obs;
  RESP[k] = RESP[k] || {};
  RESP[k].obs = ta.value;
  guardarBorrador();
}
function marcarTodo(si){
  document.querySelectorAll('.it[data-sec="'+si+'"]').forEach(it => {
    const b = it.querySelector('.opt.ok');
    if(!it.querySelector('.opt.on')) b.click();
  });
}
function contarSec(si){
  const its = document.querySelectorAll('.it[data-sec="'+si+'"]');
  let n = 0; its.forEach(i => { if(i.querySelector('.opt.on')) n++; });
  const el = $('sc'+si);
  if(el){ el.textContent = n + '/' + its.length; }
}
function actualizarProgreso(){
  const total = ITEMS.length;
  let ev = 0, ok = 0, x = 0;
  ITEMS.forEach(it => {
    const r = RESP[clave(it)];
    if(r && r.res){ ev++; if(r.res==='OK') ok++; if(r.res==='X') x++; }
  });
  const base = ok + x;
  $('pTxt').textContent = ev + ' de ' + total + ' evaluados' + (x ? ' · ' + x + ' NC' : '');
  $('pPct').textContent = base ? (ok*100/base).toFixed(0) + '%' : '—';
  $('pBar').style.width = (ev*100/total) + '%';
  $('btnEnviar').disabled = (ev < total);
  $('btnEnviar').textContent = (ev < total) ? 'Faltan ' + (total-ev) : (REEMPLAZAR ? 'Guardar corrección' : 'Enviar');
}

/* ---------- Borrador local ---------- */
function guardarBorrador(){
  lsSet(K_BORR, JSON.stringify({
    fecha:$('fecha').value, sede:$('sede').value, auditor:$('auditor').value, resp:RESP, reemplazar:REEMPLAZAR
  }));
}
function leerBorrador(){ return lsJson(K_BORR, null); }
function borrarBorrador(){ lsDel(K_BORR); }

/* ---------- Envío ---------- */
function uuid(){
  return 'A-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,9);
}

async function enviar(){
  const fecha = $('fecha').value, sede = $('sede').value, aud = $('auditor').value;
  const faltanObs = ITEMS.filter(it => {
    const r = RESP[clave(it)];
    return r && r.res === 'X' && !(r.obs || '').trim();
  });
  if(faltanObs.length){
    if(!confirm('Hay ' + faltanObs.length + ' ítem(s) marcados X sin observación.\n\nSin descripción del hallazgo, el reporte no le sirve al observador.\n\n¿Enviar igual?')) return;
  }

  const p = partes(fecha);
  const payload = {
    id: uuid(), fecha: fecha, sede: sede, auditor: aud, reemplazar: REEMPLAZAR,
    respuestas: ITEMS.map(it => {
      const r = RESP[clave(it)] || {};
      return {seccion: it.seccion, n: it.n, item: it.item, res: r.res || 'NA', obs: (r.obs||'').trim()};
    })
  };

  $('btnEnviar').disabled = true;
  $('btnEnviar').textContent = 'Enviando…';
  let r = await postar(payload);

  if(!r.ok && r.codigo === 'ya_existe'){
    const si = confirm('Mientras llenabas, se guardó otro check list del ' + fechaTxt(fecha) + ' en ' + sede +
      ' (' + r.auditor + ', ' + r.envio + ').\n\nAceptar: reemplazarlo con este.\nCancelar: no enviar.');
    if(si){ payload.reemplazar = true; r = await postar(payload); }
    else { actualizarProgreso(); return msg('No se envió. Tu check list sigue aquí, sin perder nada.', 'warn'); }
  }

  if(r.ok){
    borrarBorrador();
    REEMPLAZAR = false;
    mostrarResumen(payload, p, r.reemplazo);
  }else if(r.red){
    encolar(payload);
    borrarBorrador();
    msg('No hay señal (' + esc(r.error) + '). El check list quedó <b>guardado en el celular</b>: al recuperar señal, entra otra vez y toca "Reintentar envíos pendientes".', 'warn');
    $('btnEnviar').disabled = false;
    $('btnEnviar').textContent = 'Reintentar';
  }else{
    /* Error de datos (fecha, auditor, catálogo): no se encola, se corrige aquí. */
    actualizarProgreso();
    msg('No se guardó: ' + esc(r.error) + '. Tu check list sigue aquí, sin perder nada.');
  }
}

async function postar(payload){
  try{
    const j = await rpc('ol_guardar', {p: payload});
    if(j && j.ok) return {ok:true, reemplazo: !!j.reemplazo, duplicado: !!j.duplicado};
    return Object.assign({ok:false}, j || {}, {error: (j && j.error) || 'respuesta inválida'});
  }catch(e){
    return {ok:false, red: !!e.red, error: e.message || 'sin conexión'};
  }
}

function encolar(p){
  const q = lsJson(K_COLA, []);
  if(!q.find(x => x.id === p.id)) q.push(p);
  lsSet(K_COLA, JSON.stringify(q));
  verPendientes();
}
async function reintentar(){
  let q = lsJson(K_COLA, []);
  if(!q.length) return msg('No hay envíos pendientes.', 'ok');
  $('btnPend').disabled = true; $('btnPend').textContent = 'Enviando…';
  const quedan = [], errores = [];
  let enviados = 0;
  for(const p of q){
    let r = await postar(p);
    if(!r.ok && r.codigo === 'ya_existe'){
      const si = confirm('El check list pendiente del ' + fechaTxt(p.fecha) + ' en ' + p.sede +
        ' ya existe en el sistema (' + r.auditor + ', ' + r.envio + ').\n\n' +
        'Aceptar: reemplazarlo con el del celular.\nCancelar: descartar el del celular.');
      if(si){ p.reemplazar = true; r = await postar(p); }
      else { continue; }
    }
    if(r.ok){ enviados++; }
    else if(r.red){ quedan.push(p); }
    else { errores.push(fechaTxt(p.fecha) + ' ' + p.sede + ': ' + r.error); quedan.push(p); }
  }
  lsSet(K_COLA, JSON.stringify(quedan));
  $('btnPend').disabled = false;
  verPendientes();
  if(errores.length) msg('Algunos pendientes no se pudieron guardar:<br>' + errores.map(esc).join('<br>'), 'err');
  else msg(quedan.length ? 'Quedan ' + quedan.length + ' pendientes. Revisa la señal.' : 'Listo: ' + enviados + ' pendiente(s) enviados.', quedan.length ? 'warn' : 'ok');
}
function verPendientes(){
  const q = lsJson(K_COLA, []);
  const b = $('btnPend');
  if(q.length){ b.style.display = 'block'; b.textContent = 'Reintentar ' + q.length + ' envío(s) pendiente(s)'; }
  else { b.style.display = 'none'; }
}

function mostrarResumen(payload, p, reemplazo){
  let ok=0, x=0, na=0;
  payload.respuestas.forEach(r => { if(r.res==='OK') ok++; else if(r.res==='X') x++; else na++; });
  const base = ok + x;
  $('resumen').innerHTML =
    '<div><b>Código:</b> ' + esc(payload.id) + (reemplazo ? ' · <b style="color:#B45309">reemplazó al anterior</b>' : '') + '</div>' +
    '<div><b>Fecha:</b> ' + p.diaSemana + ' ' + p.dia + '/' + String(p.mes).padStart(2,'0') + '/' + p.anio + '</div>' +
    '<div><b>Semana:</b> ' + p.semana + ' (' + p.semanaEtq + ') · <b>Mes:</b> ' + p.mesNombre + '</div>' +
    '<div><b>Sede:</b> ' + esc(payload.sede) + ' · <b>Auditor:</b> ' + esc(payload.auditor) + '</div>' +
    '<div style="margin-top:8px"><b>Cumplimiento:</b> <span style="color:var(--sage);font-weight:700;font-size:17px">' +
      (base ? (ok*100/base).toFixed(1) + '%' : '—') + '</span></div>' +
    '<div>OK: ' + ok + ' · No conformidades: <b style="color:var(--rose)">' + x + '</b> · N/A: ' + na + '</div>';
  $('paso2').classList.add('hide');
  $('foot').classList.add('hide');
  $('paso3').classList.remove('hide');
  limpiarMsg();
  window.scrollTo(0,0);
}

  guardarBorrador();

  actualizarProgreso();
  msg('Check list vaciado. Puedes empezar de nuevo.', 'ok');

};

/* Descarta todo y vuelve al inicio: es la salida para las pruebas. */
$('btnDescartar').onclick = () => {
  if(!confirm('Se va a descartar este check list sin enviarlo y no quedará guardado en ningún lado.\n\n¿Continuar?')) return;
  RESP = {}; REEMPLAZAR = false;
  borrarBorrador();

    c.sort(function(a,b){return a.getBoundingClientRect().top-b.getBoundingClientRect().top;});return c[0]||null;}
  function contScroll(e){var p=e.parentElement;while(p&&p!==document.body){var o=getComputedStyle(p).overflowY;if(o==='auto'||o==='scroll')return p;p=p.parentElement;}return null;}
  /* ¿todo lo que se ve dentro de e son botones o enlaces? (sin campos, tablas, gráficos ni texto suelto) */
  function soloBotones(e){
    if(e.querySelector(CTL+',textarea,table,canvas,iframe,video'))return false;
    var w=document.createTreeWalker(e,NodeFilter.SHOW_TEXT,null,false),n;
    while((n=w.nextNode())){if(!n.nodeValue.trim())continue;var p=n.parentElement;if(!p||!vis(p))continue;if(!p.closest('button,a,[role=tab]'))return false;}
    return Array.prototype.some.call(e.querySelectorAll('button,a,[role=tab]'),vis);}
  function estilo(b){try{var s=getComputedStyle(b);return [s.backgroundColor,s.color,s.borderTopColor,s.borderTopWidth].join('|');}catch(e){return '';}}
  function grande(e){return Array.prototype.some.call(e.matches&&e.matches('button,a,[role=tab]')?[e]:e.querySelectorAll('button,a,[role=tab]'),function(x){return vis(x)&&x.getBoundingClientRect().height>56;});}
  function grupoDe(b){
    var g=b,p=b.parentElement;
    while(p&&p!==document.body&&!p.matches(BARRA)&&!p.matches('main,header,section,article,form,.wrap,.container,.contenedor')&&soloBotones(p)&&p.getBoundingClientRect().height<90){g=p;p=p.parentElement;}
    if(g===b){var q=b.parentElement;if(!q||!soloBotones(q))return null;}
    return g;}
  /* ¿e ya está dentro de una tarjeta o caja con fondo o borde? entonces no está "en el aire" */
  function enCaja(e){var fondo=getComputedStyle(document.body).backgroundColor,p=e.parentElement;
    while(p&&p!==document.body&&p!==document.documentElement){var s=getComputedStyle(p);
      var bg=s.backgroundColor;if(bg&&bg!=='rgba(0, 0, 0, 0)'&&bg!=='transparent'&&bg!==fondo)return true;
      if(parseFloat(s.borderTopWidth)>0&&s.borderTopStyle!=='none'&&parseFloat(s.borderLeftWidth)>0)return true;
      if(s.boxShadow&&s.boxShadow!=='none')return true;p=p.parentElement;}
    return false;}
  var F=null,FIX=null,MOV=[];
  function cajaTop(f){var c=f.querySelector(':scope > .lsTop');if(!c){c=document.createElement('div');c.className='lsTop';f.insertBefore(c,f.firstChild);}return c;}
  function aCasa(m){if(!m.bar){m.bar=document.createElement('div');m.bar.className='lsBarra';m.casa.parentNode.insertBefore(m.bar,m.casa.nextSibling);}
    if(m.g.parentNode!==m.bar)m.bar.appendChild(m.g);m.bar.style.display='';}
  function ubicar(m,f){
    if(f&&!f.contains(m.g)){cajaTop(f).appendChild(m.g);if(m.bar)m.bar.style.display='none';}
    else if(!f)aCasa(m);}
  function arreglar(){
    var f=barraFiltros(),tope=f?f.getBoundingClientRect().top:260;
    /* 1) dato de estado arriba */
    Array.prototype.forEach.call(document.querySelectorAll('div,span,p,small'),function(e){
      if(e.classList.contains('lsBaOc')||e.children.length>3||!vis(e))return;var t=txt(e);
      if(t.length>160||!EST.test(t)||hayCtl(e))return;if(e.getBoundingClientRect().top>tope+4)return;
      if(e.closest('.lsAcc,.lsBarra,.lsTop,'+BARRA))return;poner(e,'lsBaOc');});
    /* 0) grupos ya movidos que quedaron escondidos (cambio de pestaña): pasan a la barra visible o vuelven a su sitio */
    MOV.forEach(function(m){var casaVis=m.casa.parentNode&&vis(m.casa.parentNode);
      if(!casaVis){if(m.g.previousSibling!==m.casa)m.casa.parentNode.insertBefore(m.g,m.casa.nextSibling);if(m.bar)m.bar.style.display='none';return;}
      if(!vis(m.g)||m.g.previousSibling===m.casa||(f&&m.bar&&m.g.parentNode===m.bar))ubicar(m,f);});
    /* 2) botones de exportar/imprimir/actualizar flotando encima de la barra */
    var sueltos=Array.prototype.filter.call(document.querySelectorAll('button,a.btn,a[class*="btn"]'),function(b){
      if(!vis(b)||!esAcc(b)||b.closest('.lsAcc,.lsBarra,.lsTop'))return false;if(f&&f.contains(b))return false;
      if(b.closest(FUERA))return false;
      var r=b.getBoundingClientRect();if(f)return r.bottom<=tope+2;
      return r.top<200&&!enBarra(b)&&!b.closest('.panel,.card,.kpi,form,table');});
    if(sueltos.length){
      var dest=f,caja;
      if(!dest){var ref=sueltos[0];var fila=ref.parentElement;dest=document.createElement('div');dest.className='lsBarra';fila.parentNode.insertBefore(dest,fila);caja=dest;}
      else{caja=dest.querySelector(':scope > .lsAcc');if(!caja){caja=document.createElement('span');caja.className='lsAcc';dest.appendChild(caja);}}
      sueltos.forEach(function(b){var antes=b.parentElement,e0=estilo(b);caja.appendChild(b);if(estilo(b)!==e0)poner(b,'lsBtn');
        var p=antes,n=0;while(p&&p!==document.body&&n<4){if(p.contains(dest))break;if(!hayCtl(p)&&p.getBoundingClientRect().height<140){poner(p,'lsBaOc');p=p.parentElement;n++;}else break;}});
    }
    /* 2b) otros grupos de botones sueltos arriba (pestañas, Volver, vistas): a la barra; si no hay barra, se les crea una */
    if(!SIN_GRUPOS){
      var lim=f?f.getBoundingClientRect().top:220,vistos=[];
      Array.prototype.forEach.call(document.querySelectorAll('button,a,[role=tab]'),function(b){
        if(!vis(b)||!txt(b)||b.closest('.lsAcc,.lsBarra,.lsTop,aside,nav,[class*="side"],[class*="menu"],form,table,'+FUERA))return;
        if(f&&f.contains(b))return;if(enBarra(b))return;
        var s=getComputedStyle(b);if(s.position==='fixed'||s.position==='absolute')return;
        var r=b.getBoundingClientRect();if(r.bottom>lim+2||r.top>320)return;
        if(b.getBoundingClientRect().height>56)return;var g=grupoDe(b);if(!g||vistos.indexOf(g)>=0)return;if(grande(g))return;if(enCaja(g))return;
        if(g.closest('aside,nav,[class*="side"],[class*="menu"],'+FUERA))return;
        vistos.push(g);});
      vistos.forEach(function(g){if(MOV.some(function(m){return m.g===g;}))return;
        var casa=document.createElement('span');casa.className='lsCasa';casa.style.display='none';g.parentNode.insertBefore(casa,g);
        var m={g:g,casa:casa,bar:null};MOV.push(m);ubicar(m,f);});
    }
    /* 3) barra con filtros fija (si no es muy alta); botones de acción marcados para esconderse mientras está fija */
    if(f){
      Array.prototype.forEach.call(f.querySelectorAll('button,a'),function(b){if(esAcc(b))poner(b,'lsAccBtn');});
      var alta=f.getBoundingClientRect().height>ALTO_FIJO;
      if(alta){f.classList.remove('lsBaFijo');f.classList.remove('lsPegada');F=null;}
      else{
        if(getComputedStyle(f).position==='static'){poner(f,'lsBaFijo');var bg=getComputedStyle(f).backgroundColor;if(!bg||bg==='rgba(0, 0, 0, 0)'||bg==='transparent')f.style.backgroundColor=getComputedStyle(document.body).backgroundColor||'#F1F6F4';}
        F=f;FIX=contScroll(f);}
    }
    /* barras pegajosas que solo tienen botones (sin filtros): que suban con la página */
    Array.prototype.forEach.call(document.querySelectorAll(BARRA),function(b){if(b===f||!vis(b))return;var s=getComputedStyle(b).position;
      if((s==='sticky'||s==='fixed')&&!Array.prototype.some.call(b.querySelectorAll(CTL),vis)&&Array.prototype.some.call(b.querySelectorAll('button,a'),esAcc))poner(b,'lsBaSuelta');});
    pegada();
  }
  function pegada(){if(!F||!F.isConnected)return;var top=parseFloat(getComputedStyle(F).top)||0,base=FIX?FIX.getBoundingClientRect().top:0,desp=FIX?FIX.scrollTop:(window.scrollY||document.documentElement.scrollTop);
    var en=desp>4&&(F.getBoundingClientRect().top-base)<=top+1.5;if(en!==F.classList.contains('lsPegada'))F.classList.toggle('lsPegada',en);}
  document.addEventListener('scroll',function(){pegada();},true);window.addEventListener('resize',function(){pegada();luego();});
  document.addEventListener('click',function(){setTimeout(function(){try{arreglar();}catch(e){}},30);},true);
  var t=null;function luego(){if(t)return;t=setTimeout(function(){t=null;try{arreglar();}catch(e){}},250);}
  function inicio(){luego();new MutationObserver(function(ms){for(var i=0;i<ms.length;i++){if(ms[i].addedNodes.length||ms[i].removedNodes.length){luego();return;}}}).observe(document.body,{childList:true,subtree:true});
    window.addEventListener('load',luego);var k=0,iv=setInterval(function(){luego();if(++k>20)clearInterval(iv);},700);}
  if(document.body)inicio();else document.addEventListener('DOMContentLoaded',inicio);
  window.__lsBa={arreglar:arreglar,MOV:MOV,F:function(){return F;},bf:barraFiltros};
}catch(e){}})();</script>
